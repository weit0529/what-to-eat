<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 让手机按设备宽度显示，不缩小成电脑页面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 手机浏览器地址栏的颜色，和顶栏的深绿一致 -->
    <meta name="theme-color" content="#0a4033" />
    <title>今天吃什么？</title>
    <!-- 网站图标（用户 2026-11-06 给的 Logo）：浏览器标签页用 favicon，手机“添加到主屏幕”用 apple-touch-icon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <!-- Vue 应用挂载在这里，内容由 src/App.vue 生成 -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
